<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Dashboard — Login</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #151b23;
            --line: #2a333f;
            --tx: #e6edf3;
            --tx2: #9fb0c3;
            --tx3: #6b7d91;
            --acc: #5b9dd9;
            --acc2: #c99a3d;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .login-box {
            background: var(--bg2);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 40px;
            width: 100%;
            max-width: 320px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 24px;
            text-align: center;
            font-weight: 650;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--tx3);
            margin-bottom: 6px;
            letter-spacing: .05em;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #0d1117;
            color: var(--tx);
            font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        }
        input:focus {
            outline: none;
            border-color: var(--acc);
            box-shadow: 0 0 0 3px rgba(91, 157, 217, .1);
        }
        button {
            width: 100%;
            padding: 10px 12px;
            background: var(--acc2);
            color: #0d1117;
            border: none;
            border-radius: 5px;
            font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            opacity: 0.8;
        }
        .error {
            background: rgba(224, 85, 99, .1);
            border: 1px solid rgba(224, 85, 99, .3);
            color: #e05563;
            padding: 10px 12px;
            border-radius: 5px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .hint {
            text-align: center;
            font-size: 12px;
            color: var(--tx3);
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>Portfolio Monitor</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="hint">Private dashboard. Session expires after 30 days.</div>
</div>
</body>
</html>
